<script src="daten/texte.js"></script>
<script src="seite.js"></script>
<script>
(function () {
  'use strict';
  var F = window.FSeite;
  if (!F || !F.texte) return;
  var T = F.texte;
  var journal = document.getElementById('texte');
  var alle = T.alle('untertext');
  if (!alle.length) return;
  var endetMitZeichen = function (html) {
    return /[.!?…:]$/.test(String(html).replace(/<[^>]*>/g, '').replace(/[“‘’»«)\s]+$/, ''));
  };
  journal.innerHTML = alle.map(function (t) {
    var d = T.datum(t.datum), titel = F.versalien(T.satz(t.titel));
    var verweis = '<a href="' + F.SEITEN.lesen + '#' + t.slug + '">' + titel + '</a>'
      + (t.untertitel ? (endetMitZeichen(titel) ? ' ' : '. ') + T.punkt(F.versalien(T.satz(t.untertitel))) : '');
    return '<article>'
      + (d ? '<h2><time datetime="' + F.esc(String(t.datum).trim()) + '">' + d + '</time></h2><p>' + verweis + '</p>'
           : '<h2>' + verweis + '</h2>')
      + '</article>';
  }).join('');
  journal.hidden = false;
})();
</script>
